name: Validate visual foundation

on:
  push:
    branches:
      - rebuild/visual-foundation

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript module syntax
        run: node --input-type=module --check < src/main.js
      - name: Check required files
        run: test -s index.html && test -s src/main.js && test -s src/style.css
