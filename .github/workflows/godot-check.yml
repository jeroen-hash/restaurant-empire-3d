name: Godot project validation

on:
  push:
    branches:
      - rebuild/visual-foundation
      - rebuild/real-kitchen-v1
    paths:
      - "godot/**"
      - ".github/workflows/godot-check.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64
          sudo mv godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import and parse Godot project
        run: godot --headless --editor --path godot --quit

      - name: Run restaurant economy tests
        run: godot --headless --path godot --script res://tests/test_economy.gd

      - name: Run culinary school progression tests
        run: godot --headless --path godot --script res://tests/test_education.gd

      - name: Run first- and third-person camera tests
        run: godot --headless --path godot --script res://tests/test_camera.gd

      - name: Run save migration tests
        run: godot --headless --path godot --script res://tests/test_save_migration.gd

      - name: Run practical cooking lesson tests
        run: godot --headless --path godot --script res://tests/test_cooking_lesson.gd

      - name: Launch main scene headlessly
        run: godot --headless --path godot --quit-after 10

      - name: Install Godot Web export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O export_templates.tpz
          mkdir -p "$RUNNER_TEMP/godot-export-templates" "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q export_templates.tpz -d "$RUNNER_TEMP/godot-export-templates"
          cp -a "$RUNNER_TEMP/godot-export-templates/templates/." "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          ls -la "$HOME/.local/share/godot/export_templates/4.4.1.stable"

      - name: Export Web test build
        run: |
          mkdir -p dist
          godot --headless --path godot --export-release "Web" ../dist/index.html
          test -s dist/index.html
          find dist -maxdepth 1 -type f -printf '%f %s bytes\\n'

      - name: Upload Web test build
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-empire-3d-web-test
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish playable web build
        id: deployment
        uses: actions/deploy-pages@v4
