name: Publish real-kitchen iPhone test
on:
  push:
    branches:
      - rebuild/visual-foundation
    paths:
      - ".github/workflows/deploy-real-kitchen.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restaurant-empire-3d-test-export
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/visual-foundation

      - name: Check out the real game source
        uses: actions/checkout@v4
        with:
          ref: rebuild/real-kitchen-v1
          path: game

      - name: Install official Godot 4.5.1 editor and Web templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.5.1-stable_linux.x86_64
          sudo mv godot-bin/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -O templates.tpz
          mkdir -p "$RUNNER_TEMP/godot-templates" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -q templates.tpz -d "$RUNNER_TEMP/godot-templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.5.1.stable/"

      - name: Download the licensed game assets
        run: |
          mkdir -p game/godot/assets/characters game/godot/assets/environment
          curl -fL --retry 3 https://models.vinish.dev/people/casual-man.glb -o game/godot/assets/characters/casual-man.glb
          curl -fL --retry 3 https://models.vinish.dev/people/casual-woman.glb -o game/godot/assets/characters/casual-woman.glb
          curl -fL --retry 3 https://files.innerscene.com/library/restaurant-service-station-c9b08fa4/a452f798f24d80dda162/restaurant-service-station.glb -o game/godot/assets/environment/restaurant-service-station.glb
          curl -fL --retry 3 https://files.innerscene.com/library/restaurant-2-top-table-set-49d30711/f6f195708795d83bf51a/restaurant-2-top-table-set.glb -o game/godot/assets/environment/restaurant-2-top-table-set.glb
          curl -fL --retry 3 https://files.innerscene.com/library/casual-dining-restaurant-interior-60-covers-a1baf64a/c93ee621542c51b8f223/casual-dining-restaurant-interior-60-covers.glb -o game/godot/assets/environment/casual-dining-restaurant-interior-60-covers.glb
          curl -fL --retry 3 https://cdn.3dassets.dev/assets/16541/v1/model.glb -o game/godot/assets/environment/working-kitchen-line.glb
          npx --yes @gltf-transform/cli dequantize game/godot/assets/environment/casual-dining-restaurant-interior-60-covers.glb /tmp/dining.glb
          mv /tmp/dining.glb game/godot/assets/environment/casual-dining-restaurant-interior-60-covers.glb
          npx --yes @gltf-transform/cli dequantize game/godot/assets/environment/working-kitchen-line.glb /tmp/kitchen.glb
          mv /tmp/kitchen.glb game/godot/assets/environment/working-kitchen-line.glb

      - name: Import and parse the complete game
        run: timeout 300s godot --headless --editor --path game/godot --quit --verbose

      - name: Run gameplay and data tests
        run: |
          godot --headless --path game/godot --script res://tests/test_economy.gd
          godot --headless --path game/godot --script res://tests/test_education.gd
          godot --headless --path game/godot --script res://tests/test_camera.gd
          timeout 180s godot --headless --path game/godot --script res://tests/test_kitchen_interaction.gd
          godot --headless --path game/godot --script res://tests/test_save_migration.gd
          godot --headless --path game/godot --script res://tests/test_cooking_lesson.gd

      - name: Launch the real main scene headlessly
        run: timeout 90s godot --headless --path game/godot --quit-after 10

      - name: Export the full game for mobile Safari
        run: |
          mkdir -p real-game-test
          godot --headless --path game/godot --export-release "Web" "$GITHUB_WORKSPACE/real-game-test/index.html"
          test -s real-game-test/index.html
          test -s real-game-test/index.wasm
          test -s real-game-test/index.pck
          touch real-game-test/.nojekyll
          cat > real-game-test/README.txt <<'EOF'
          RESTAURANT EMPIRE 3D - Real game iPhone test
          This is the full Godot game export, not the minimal cube diagnostic.
          It is an early test build and has not yet been confirmed on a physical iPhone.
          EOF
          ls -lh real-game-test/index.html real-game-test/index.wasm real-game-test/index.pck

      - name: Publish the test build without replacing the main site
        run: |
          git fetch origin rebuild/visual-foundation
          git reset --hard origin/rebuild/visual-foundation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add real-game-test/
          git commit -m "Publish full RESTAURANT EMPIRE 3D iPhone test" || exit 0
          git push origin HEAD:rebuild/visual-foundation
# Rebuild trigger: validate final kitchen interaction camera alignment.
